<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --home:#1f2937; --bg:#f7f5f0; --ink:#23201b; --muted:#6b6358;
    --card:#ffffff; --line:#e7e2d8;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"DM Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5}
  header{padding:28px 24px 16px;max-width:1100px;margin:0 auto}
  h1{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:34px;margin:0 0 6px}
  .sub{color:var(--muted);margin:0}
  .chips{max-width:1100px;margin:0 auto;padding:8px 24px 14px;display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
    background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;
    user-select:none;transition:opacity .15s}
  .chip .dot{width:10px;height:10px;border-radius:50%}
  .chip.off{opacity:.38}
  #map{height:62vh;min-height:420px;width:100%;border-top:1px solid var(--line);
    border-bottom:1px solid var(--line)}
  .home-dot{background:var(--home);width:18px;height:18px;border-radius:50%;
    border:3px solid #fff;box-shadow:0 0 0 2px var(--home)}
  main{max-width:1100px;margin:0 auto;padding:24px}
  .section{margin:34px 0}
  .section h2{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:23px;
    display:flex;align-items:center;gap:10px;margin:0 0 14px;padding-bottom:8px;
    border-bottom:2px solid var(--line)}
  .section h2 .swatch{width:14px;height:14px;border-radius:50%}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .place{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;cursor:pointer;transition:transform .1s,box-shadow .1s}
  .place:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.07)}
  .place .nm{font-weight:600;margin:0 0 4px}
  .place .tags{font-size:12px;color:var(--muted);margin:0 0 8px}
  .place .bl{color:var(--muted);font-size:14px;margin:0 0 10px}
  .place .meta{display:flex;justify-content:space-between;align-items:center;font-size:13px}
  .place .walk{color:var(--ink);font-weight:600}
  .place a.dir{color:#3d6db5;text-decoration:none;font-weight:600}
  footer{max-width:1100px;margin:0 auto;padding:8px 24px 48px;color:var(--muted);font-size:13px}
  @media (max-width:640px){
    h1{font-size:27px}
    #map{height:54vh}
    header,main,.chips,footer{padding-left:16px;padding-right:16px}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>

// Walking minutes from home, via straight-line distance × city detour factor.
function walkMinutes(lat, lng){
  const R = 6371000; // m
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat - HOME.lat), dLng = toRad(lng - HOME.lng);
  const a = Math.sin(dLat/2)**2 +
            Math.cos(toRad(HOME.lat))*Math.cos(toRad(lat))*Math.sin(dLng/2)**2;
  const straight = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  const walked = straight * 1.30;      // ~30% detour for real streets
  const min = Math.round(walked / 75); // ~75 m/min ≈ 4.5 km/h
  return Math.max(1, min);
}

// --- Data sanity check (harmless; logs to console) ---

  if(typeof p.lat!=='number' || typeof p.lng!=='number') console.error('Bad coords:', p.name);

});

// Precompute walking minutes once per place (stable; used by pins and cards).
PLACES.forEach(p => { p._mins = walkMinutes(p.lat, p.lng); });

// --- Map ---
// scrollWheelZoom off so the page scrolls smoothly past the map; +/- buttons and pinch still zoom.

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const homeIcon = L.divIcon({ className:'', html:'<div class="home-dot" title="Home"></div>',
  iconSize:[18,18], iconAnchor:[9,9] });
L.marker([HOME.lat, HOME.lng], { icon: homeIcon, zIndexOffset: 1000 })
  .addTo(map).bindPopup('<b>Home</b>');

function pinIcon(color){
  return L.divIcon({
    className:'',
    html:`<div style="width:16px;height:16px;border-radius:50% 50% 50% 0;
      transform:rotate(-45deg);background:${color};border:2px solid #fff;
      box-shadow:0 1px 3px rgba(0,0,0,.4)"></div>`,
    iconSize:[16,16], iconAnchor:[8,16], popupAnchor:[0,-14]
  });
}

const markers = {};        // name -> Leaflet marker
const layerByCat = {};     // catKey -> L.layerGroup
CATEGORIES.forEach(c => { layerByCat[c.key] = L.layerGroup().addTo(map); });

PLACES.forEach(p => {
  const c = CAT[p.cat];
  const mins = p._mins;
  const tagLine = (p.tags && p.tags.length) ? `<br><span style="color:#6b6358">${p.tags.join(' · ')}</span>` : '';
  const popup =
    `<b>${p.name}</b>${tagLine}<br>${p.blurb}` +
    `<br><b>${mins} min</b> walk · <a href="${p.gmaps}" target="_blank" rel="noopener">Directions ↗</a>`;
  const m = L.marker([p.lat, p.lng], { icon: pinIcon(c.color) })
    .bindPopup(popup)
    .addTo(layerByCat[p.cat]);
  markers[p.name] = m;
});

// --- Filter chips ---
const chips = document.getElementById('chips');
CATEGORIES.forEach(c => {
  const el = document.createElement('span');
  el.className = 'chip';
  el.dataset.cat = c.key;
  el.setAttribute('role', 'button');
  el.setAttribute('tabindex', '0');
  el.setAttribute('aria-pressed', 'true');
  el.innerHTML = `<span class="dot" style="background:${c.color}"></span>${c.emoji} ${c.label}`;
  el.addEventListener('click', () => {
    el.classList.toggle('off');
    const off = el.classList.contains('off');
    el.setAttribute('aria-pressed', String(!off));
    if(off) map.removeLayer(layerByCat[c.key]);
    else layerByCat[c.key].addTo(map);
  });
  el.addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); el.click(); }
  });
  chips.appendChild(el);
});

// --- Category cards ---
const sections = document.getElementById('sections');
CATEGORIES.forEach(c => {
  const items = PLACES.filter(p => p.cat === c.key);
  if(!items.length) return;
  const sec = document.createElement('section');
  sec.className = 'section';
  sec.innerHTML = `<h2><span class="swatch" style="background:${c.color}"></span>${c.emoji} ${c.label}</h2>`;
  const grid = document.createElement('div');
  grid.className = 'grid';
  items
    .map(p => ({ p, mins: p._mins }))
    .sort((a,b) => a.mins - b.mins)
    .forEach(({p, mins}) => {
      const card = document.createElement('div');
      card.className = 'place';
      const tags = (p.tags && p.tags.length) ? `<p class="tags">${p.tags.join(' · ')}</p>` : '';
      card.innerHTML =
        `<p class="nm">${p.name}</p>${tags}<p class="bl">${p.blurb}</p>` +
        `<div class="meta"><span class="walk">${mins} min walk</span>` +
        `<a class="dir" href="${p.gmaps}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Directions ↗</a></div>`;
      card.addEventListener('click', () => {
        if(!map.hasLayer(layerByCat[p.cat])){
          layerByCat[p.cat].addTo(map);
          const chip = document.querySelector(`.chip[data-cat="${p.cat}"]`);
          if(chip) chip.classList.remove('off');
        }
        map.setView([p.lat, p.lng], 17, { animate:true });
        const mk = markers[p.name];
        if(mk) mk.openPopup();
        document.getElementById('map').scrollIntoView({ behavior:'smooth', block:'start' });
      });
      grid.appendChild(card);
    });
  sec.appendChild(grid);
  sections.appendChild(sec);
});
</script>
</body>
</html>
